services:
  mysql-lab11:
    image: mysql:8.4
    container_name: mysql-lab11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 'Root123*'
      MYSQL_DATABASE: 'bd_laboratorio11'
    ports:
      - "3306:3306"
    volumes:
      - mysql_lab11_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRoot123*"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_lab11_data:
    name: mysql_lab11_data
