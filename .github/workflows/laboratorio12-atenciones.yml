name: Lab 12 - Transacciones y JPQL

on:
  pull_request:
    paths:
      - 'laboratorio12-atenciones/**'
      - '.github/workflows/laboratorio12-atenciones.yml'
  push:
    branches:
      - laboratorio12-atenciones-jpql-rollback
      - main
    paths:
      - 'laboratorio12-atenciones/**'
      - '.github/workflows/laboratorio12-atenciones.yml'

jobs:
  pruebas-jpa-h2:
    name: Tests de rollback, commit y JPQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Ejecutar pruebas en el laboratorio 12
        working-directory: laboratorio12-atenciones
        run: ./mvnw -B clean test
