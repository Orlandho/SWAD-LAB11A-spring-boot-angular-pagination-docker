name: CI - Spring Boot & Angular Pagination Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Test Suite (Spring Boot 3 + Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Unit and Integration Tests
        working-directory: ./backend-productos
        run: mvn clean test --batch-mode

  frontend-test:
    name: Frontend Test & Build Suite (Angular 22 + Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend-productos/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend-productos
        run: npm ci

      - name: Run Angular Unit Tests
        working-directory: ./frontend-productos
        run: npx ng test --no-watch

      - name: Compile Production Bundle
        working-directory: ./frontend-productos
        run: npm run build
